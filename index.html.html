<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Lab - Expo Reclutamiento</title>
    <style>
        :root { --primary: #6366f1; --secondary: #f43f5e; --bg: #0f172a; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .container { width: 90%; max-width: 500px; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); margin-top: 20px; border: 1px solid #334155; }
        button { background: var(--primary); color: white; border: none; padding: 15px 30px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: transform 0.2s; font-size: 1.1em; width: 100%; margin: 10px 0; }
        button:active { transform: scale(0.95); }
        .result-badge { font-size: 1.5em; color: #10b981; margin: 20px 0; font-weight: bold; }
        #game-area { display: none; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .btn-circle { width: 100%; aspect-ratio: 1/1; border-radius: 15px; border: none; cursor: pointer; }
        #balloon-container { height: 250px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div class="container" id="main-menu">
    <h1>🚀 Skill Lab</h1>
    <p>Mide tu potencial en segundos. ¿Qué reto eliges?</p>
    <div class="card">
        <button onclick="startBART()">🎈 Riesgo y Decisión (5 Rondas)</button>
        <button onclick="startFlex()">🧠 Flexibilidad Mental (40 seg)</button>
        <button onclick="startPriority()">⚡ Priorización Express</button>
    </div>
</div>

<div class="container" id="game-area">
    <h2 id="game-title">Juego</h2>
    <div id="game-content" class="card"></div>
    <button onclick="location.reload()" style="background:#475569; margin-top:20px;">Volver al Menú</button>
</div>

<script>
    const area = document.getElementById('game-area');
    const menu = document.getElementById('main-menu');
    const content = document.getElementById('game-content');
    const title = document.getElementById('game-title');

    function showGame(name) {
        menu.style.display = 'none';
        area.style.display = 'block';
        title.innerText = name;
    }

    // --- JUEGO 1: BART (5 RONDAS ACTUALIZADO) ---
    function startBART() {
        showGame("Riesgo y Decisión");
        let points = 0; let total = 0; let round = 1;
        const popLimit = () => Math.floor(Math.random() * 15) + 3;
        let limit = popLimit();

        const updateBART = () => {
            content.innerHTML = `
                <p>Ronda: <strong>${round} de 5</strong></p>
                <div id="balloon-container">
                    <div id="b" style="width:${50+points*12}px; height:${50+points*12}px; background:radial-gradient(circle at 30% 30%, #ff4d4d, #990000); border-radius:50%; transition: 0.1s; box-shadow: 0 5px 15px rgba(0,0,0,0.3);"></div>
                </div>
                <p>Puntos en esta ronda: <strong>${points}</strong></p>
                <button onclick="window.pump()">Inflar Globo</button>
                <button onclick="window.collect()" style="background:#10b981">Asegurar Puntos</button>
                <p style="font-size:0.8em; margin-top:10px;">Puntos Totales: ${total}</p>
            `;
        };

        window.pump = () => {
            points++;
            if(points >= limit) {
                alert("¡BOOM! El globo explotó.");
                window.collect(true);
            } else updateBART();
        };

        window.collect = (popped = false) => {
            if(!popped) total += points;
            if(round < 5) { // ACTUALIZADO A 5 RONDAS
                round++; points = 0; limit = popLimit(); updateBART();
            } else {
                let perfil = total > 35 ? "Visionario Audaz" : (total > 15 ? "Estratega Prudente" : "Analista de Calidad");
                finish("Perfil: " + perfil, total + " puntos totales");
            }
        };
        updateBART();
    }

    // --- JUEGO 2: FLEXIBILIDAD (40 SEGUNDOS ACTUALIZADO) ---
    function startFlex() {
        showGame("Flexibilidad Mental");
        let score = 0; 
        let timeLeft = 40; // ACTUALIZADO A 40 SEGUNDOS
        const colors = ['ROJO', 'AZUL', 'VERDE'];
        const hex = { 'ROJO': '#ef4444', 'AZUL': '#3b82f6', 'VERDE': '#22c55e' };

        const nextRound = () => {
            if(timeLeft <= 0) return;
            const text = colors[Math.floor(Math.random()*3)];
            const colorName = colors[Math.floor(Math.random()*3)];
            content.innerHTML = `
                <p>Toca el color de la <strong>TINTA</strong>, no lo que dice la palabra.</p>
                <h1 style="color:${hex[colorName]}; font-size: 3.5em; margin: 20px 0; text-shadow: 2px 2px 4px rgba(0,0,0,0.5);">${text}</h1>
                <div class="grid-3">
                    ${colors.map(c => `<button class="btn-circle" style="background:${hex[c]}" onclick="window.checkFlex('${c}', '${colorName}')"></button>`).join('')}
                </div>
                <hr style="margin:20px 0; opacity:0.2">
                <p>Aciertos: <strong>${score}</strong> | Tiempo: <strong id="t-clock">${timeLeft}s</strong></p>
            `;
        };

        window.checkFlex = (chosen, correct) => {
            if(chosen === correct) score++;
            nextRound();
        };

        let timer = setInterval(() => {
            timeLeft--;
            const clockEl = document.getElementById('t-clock');
            if(clockEl) clockEl.innerText = timeLeft + "s";
            if(timeLeft <= 0) {
                clearInterval(timer);
                let perfil = score > 25 ? "Ninja de la Adaptabilidad" : (score > 12 ? "Pensador Analítico" : "Especialista de Foco");
                finish("Perfil: " + perfil, score + " aciertos");
            }
        }, 1000);
        nextRound();
    }

    // --- JUEGO 3: PRIORIZACIÓN ---
    function startPriority() {
        showGame("Priorización Express");
        let items = [
            {n: "Crisis Cliente VIP", v: 100}, {n: "Email rutinario", v: 10},
            {n: "Proyecto Estratégico", v: 80}, {n: "Café con el equipo", v: 20},
            {n: "Reporte Mensual", v: 50}, {n: "Limpiar bandeja entrada", v: 5}
        ].sort(() => Math.random() - 0.5);
        
        let selected = [];
        const render = () => {
            content.innerHTML = `<p>Solo puedes elegir <strong>3 tareas</strong>. ¡Elige las que den más valor!</p>`;
            items.forEach((item, i) => {
                if(!selected.includes(i)) {
                    content.innerHTML += `<button onclick="window.selP(${i})">${item.n}</button>`;
                }
            });
            if(selected.length === 3) {
                let val = selected.reduce((acc, curr) => acc + items[curr].v, 0);
                let perfil = val > 200 ? "Líder de Alto Impacto" : "Gestor Operativo";
                finish("Perfil: " + perfil, val + " puntos de impacto");
            }
        };
        window.selP = (i) => { selected.push(i); render(); };
        render();
    }

    function finish(perfil, score) {
        content.innerHTML = `
            <div class="result-badge">¡Reto Finalizado!</div>
            <h2 style="color:#f1c40f">${perfil}</h2>
            <p>Resultado: <strong>${score}</strong></p>
            <div style="background:#0f172a; padding:15px; border-radius:10px; margin-top:10px;">
                <p style="font-size:0.9em;">Muestra esta pantalla al reclutador para validar tu skill.</p>
            </div>
        `;
    }
</script>
</body>
</html>
